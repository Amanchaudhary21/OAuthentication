spring.application.name=Oauth

# Secrets come from environment variables or from a local .env file (git-ignored).
# Copy .env.example to .env and fill in your own values.
spring.config.import=optional:file:.env[.properties]

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oauth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Creates/updates tables automatically from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
